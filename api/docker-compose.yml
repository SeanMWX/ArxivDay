services:
  api:
    build:
      context: .
    image: arxivday-api:latest
    container_name: arxivday-api
    ports:
      - "${API_HOST_PORT:-8000}:${API_PORT:-8000}"
    environment:
      API_PORT: "${API_PORT:-8000}"
      API_KEY: "${API_KEY:?Set API_KEY in .env}"
      DB_HOST: "${DB_HOST:?Set DB_HOST in .env}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:?Set DB_USER in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_NAME: "${DB_NAME:-arxiv}"
      ARXIV_TABLE: "${ARXIV_TABLE:-arxiv_daily}"
      CATEGORIES: "${CATEGORIES:-cs.AI, cs.CR, cs.LG}"
      SYNC_DB_PATH: "${SYNC_DB_PATH:-/data/sync.db}"
    volumes:
      - api-sync-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port=os.environ.get('API_PORT','8000'); key=os.environ['API_KEY']; req=urllib.request.Request(f'http://127.0.0.1:{port}/health', headers={'X-API-Key': key}); urllib.request.urlopen(req, timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  api-sync-data:
